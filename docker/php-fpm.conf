[www]
; HTTP 访问日志由 Caddy 记录，PHP-FPM 只输出应用和 worker 错误。
access.log = /dev/null

; 供容器健康检查用：不经过应用代码，只证明 php-fpm 活着
ping.path = /ping
ping.response = pong

; 让 worker 的输出进入容器日志，否则 PHP 的 warning/fatal 会丢失
catch_workers_output = yes
decorate_workers_output = no

; 关键：默认 php-fpm 会清空环境变量，容器里注入的 ACG_DB_* 就到不了 PHP。
; 安装向导要靠它自动填好内置数据库的连接信息。
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
