services:
  # Generate stable credentials once and keep them outside the images.
  secrets-init:
    image: alpine:3.20
    restart: "no"
    entrypoint: ["/bin/sh", "/secrets-init.sh"]
    volumes:
      - ./docker/secrets-init.sh:/secrets-init.sh:ro
      - acg_secrets:/secrets

  app:
    image: ${ACG_IMAGE:-ghcr.io/lizhipay/acg-faka:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ACG_DB_HOST: mariadb
      ACG_DB_PORT: "3306"
      ACG_DB_DATABASE: acg_faka
      ACG_DB_USERNAME: acg
      ACG_DB_PASSWORD_FILE: /run/secrets/mysql_app
      ACG_DB_PREFIX: acg_
      ACG_REDIS_HOST: redis
      ACG_REDIS_PORT: "6379"
      ACG_REDIS_DB: "1"
    volumes:
      - acg_data:/data
      - acg_secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${ACG_HTTP_PORT:-8080}:80"
      - "${ACG_HTTPS_PORT:-8443}:443"
    volumes:
      - acg_data:/app-data:ro
      - caddy_data:/data
      - caddy_config:/config

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mysql_root
      MARIADB_DATABASE: acg_faka
      MARIADB_USER: acg
      MARIADB_PASSWORD_FILE: /run/secrets/mysql_app
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - acg_secrets:/run/secrets:ro
      - acg_mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$(cat /run/secrets/mysql_root)\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - acg_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  acg_data:
  acg_secrets:
  acg_mysql:
  acg_redis:
  caddy_data:
  caddy_config:
